{% set version = "0.18.0" %}

package:
  name: pygfx
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pygfx/pygfx-{{ version }}.tar.gz
  sha256: ed5e3507781bc26be321c5fe5246c247830eaee1018c484cb507d3148f3a7355
  patches:
    # https://github.com/pygfx/pygfx/pull/1353
    - 0001-stencil-value-tracked-store.patch
    # https://github.com/pygfx/pygfx/pull/1348
    - 0002-texturesample-uniform-control-flow.patch
    # https://github.com/pygfx/pygfx/pull/1349
    - 0003-meshphysicalmaterial-4-bind-groups.patch
    # https://github.com/pygfx/pygfx/pull/1350
    - 0004-computeshader-read-texture-view.patch
    # https://github.com/pygfx/pygfx/pull/1351
    - 0005-last-modified-counter.patch

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - pip
    - flit-core >=3.2,<5
  run:
    - python >={{ python_min }}
    - numpy >=2.1
    - rendercanvas >=2.7.0
    - wgpu-py >=0.30.1
    - pylinalg >=0.6.8,<0.7.0
    - freetype-py
    - uharfbuzz
    - jinja2
    - hsluv >=5.0.0

test:
  imports:
    - pygfx
  requires:
    - python {{ python_min }}
    - pip
  commands:
    - pip check
about:
  home: https://github.com/pygfx/pygfx
  summary: "Pygfx' purpose is to bring powerful and reliable visualization to the Python world. 🚀"
  license: BSD-2-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hmaarrfk
