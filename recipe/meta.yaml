{% set version = "0.17.0" %}

package:
  name: pygfx
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pygfx/pygfx-{{ version }}.tar.gz
  sha256: 97759f7e4e8a35b278dab04426fd1b89a32499b117035d3e6074f69990b31553
  patches:
    # Fix dashing on line loops -- https://github.com/pygfx/pygfx/pull/1315
    - 1315_fix_dashing_on_line_loops.patch
    # Bake with the viewport size, not the canvas size
    # https://github.com/pygfx/pygfx/pull/1324
    - 1324_viewport_bake_size.patch

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - flit-core
  run:
    - python >={{ python_min }}
    - numpy
    - rendercanvas >=2.6.1
    - wgpu-py >=0.30.1
    - pylinalg >=0.6.8,<0.7.0
    - freetype-py
    - uharfbuzz
    - jinja2
    - hsluv >=5.0.0

test:
  imports:
    - pygfx
  requires:
    - python {{ python_min }}
    - pip
  commands:
    - pip check
about:
  home: https://github.com/pygfx/pygfx
  summary: "Pygfx' purpose is to bring powerful and reliable visualization to the Python world. 🚀"
  license: BSD-2-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hmaarrfk
